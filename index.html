.backtop:hover{transform:translateY(-3px)}
.toast{position:fixed;left:50%;bottom:calc(30px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(16px);background:var(--ink);color:var(--bg);padding:.55rem 1.15rem;border-radius:999px;font-size:.82rem;font-weight:600;box-shadow:var(--shadow-lg);opacity:0;pointer-events:none;transition:opacity .28s ease,transform .28s ease;z-index:70;max-width:88vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ============ 证书原图灯箱 ============ */
.lb{position:fixed;inset:0;z-index:90;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.7rem;padding:3.4rem 1rem 2.4rem;background:rgba(6,12,9,.93);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);opacity:0;pointer-events:none;transition:opacity .22s ease}
.lb.show{opacity:1;pointer-events:auto}
.lb img{max-width:min(100%,980px);max-height:76vh;width:auto;height:auto;border-radius:8px;box-shadow:0 24px 70px rgba(0,0,0,.55);transform:scale(.97);transition:transform .22s ease}
.lb.show img{transform:scale(1)}
.lb-cap{color:rgba(255,255,255,.9);font-size:.84rem;text-align:center;max-width:640px;line-height:1.6}
.lb-hint{color:rgba(255,255,255,.5);font-size:.72rem}
.lb-close{position:absolute;top:calc(.9rem + env(safe-area-inset-top));right:.9rem;width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.1);color:#fff;font-size:1.25rem;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .2s ease}
.lb-close:hover{background:rgba(255,255,255,.22)}

/* ============ 进场动画 ============ */
.reveal{opacity:0;transform:translateY(16px);transition:opacity .5s ease,transform .5s ease}
.reveal.in{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation:none!important;transition:none!important}
  .reveal{opacity:1;transform:none}
}

/* ============ 桌面增强（≥640px） ============ */
@media (min-width:640px){
  body{font-size:16px}
  .wrap{padding:0 1.25rem}
  .sec{margin:4.2rem 0;scroll-margin-top:88px}
  .sec-head h2{font-size:1.4rem}
  .stats{grid-template-columns:repeat(auto-fit,minmax(172px,1fr));gap:1rem}
  .card-grid,.skill-grid{grid-template-columns:repeat(2,1fr);gap:1.15rem}
  .cert-grid{grid-template-columns:repeat(2,1fr)}
  .card{padding:1.45rem}
  .stat{padding:1.25rem 1.15rem}
  .stat-value{font-size:1.85rem}
  .letter{padding:2.3rem 2.4rem 2rem}
  .hero{padding:5.6rem 0 4.2rem}
  .sec{scroll-margin-top:72px}
}
@media (min-width:760px){
  .xp{grid-template-columns:150px 1fr;gap:1.5rem}
  .xp-when{flex-direction:column;gap:.15rem;padding-top:.1rem}
  .skill-row{grid-template-columns:150px 1fr 44px;grid-template-areas:'label bar level';gap:.8rem;align-items:center}
  .nav-strip{display:none}
  .nav-inner .nav-links{display:flex}
}
@media (min-width:880px){
  .hero-grid{grid-template-columns:1.65fr .95fr;gap:2.8rem;align-items:center}
  .hero-side{flex-direction:column;align-items:stretch;justify-content:flex-start;flex-wrap:nowrap}
  .avatar img{width:150px;height:200px;border-radius:18px}
}
@media (min-width:760px) and (max-width:879px){
  .hero-side{justify-content:flex-start}
}
/* 桌面下导航链接嵌入顶栏 */
.nav-links-desktop{display:none;gap:.15rem;flex:1}
@media (min-width:760px){
  .nav-links-desktop{display:flex}
  .nav-links-desktop .nav-link{min-height:38px;font-size:.88rem}
}
@media (min-width:760px){
  .brand-sub{font-size:.78rem}
}

/* ============ 打印 ============ */
@media print{
  @page{margin:12mm}
  :root,[data-theme="dark"]{
    --bg:#ffffff; --bg2:#ffffff; --ink:#111827; --muted:#556172; --rule:#d7dde6;
    --accent:#0a7a5c; --accent2:#2563eb;
    --accent-soft:rgba(10,122,92,.10); --accent2-soft:rgba(37,99,235,.12);
    --shadow:none; --shadow-lg:none;
  }
  body{background:#fff;background-image:none;font-size:12.5px}
  .nav,.backtop,.toast,.hero-cta,.tabs,.nav-strip{display:none!important}
  .hero{padding:0 0 1.4rem;border-bottom:1.5px solid var(--ink)}
  .hero::before,.hero::after{display:none}
  .avatar img{width:96px;height:128px;border-radius:10px}
  .stat-value,.total-line .tv,.plan-num{background:none;-webkit-text-fill-color:var(--accent);color:var(--accent)}
  [role=tabpanel]{display:block!important}
  .panel-title{display:block!important}
  .reveal{opacity:1!important;transform:none!important}
  .sec{margin:1.6rem 0;page-break-inside:avoid}
  .card,.stat,.xp,.cert,.letter{box-shadow:none;break-inside:avoid;page-break-inside:avoid}
  .xp-list{gap:1rem}
  .c-chip.missing{display:none}
  .letter{border:1.5px solid var(--ink)}
  a{color:inherit}
  .lb{display:none!important}
  .cert-zoom{display:none}
  .cert-img{cursor:default}
  .cert-img,.cert-img img{page-break-inside:avoid;break-inside:avoid}
  .cert-grid{grid-template-columns:1fr 1fr;gap:6mm}
}
</style>

function buildTabbed(sec, groups, D){
  var tabsEl = el('div','tabs');
  tabsEl.setAttribute('role','tablist');
  tabsEl.setAttribute('aria-label', sec.getAttribute('aria-label') || 'content');
  var panels = [];
  groups.forEach(function(g, i){
    var tab = el('button','tab' + (i === 0 ? ' active' : ''), g.label);
    tab.type = 'button';
    tab.id = 'tab-' + sec.id + '-' + g.id;
    tab.setAttribute('role','tab');
    tab.setAttribute('aria-controls','panel-' + sec.id + '-' + g.id);
    tab.setAttribute('aria-selected', i === 0 ? 'true' : 'false');
    tab.tabIndex = i === 0 ? 0 : -1;
    tabsEl.appendChild(tab);
    panels.push({ tab: tab, group: g, index: i });
  });
  function activate(idx){
    panels.forEach(function(p, i){
      var on = i === idx;
      p.tab.classList.toggle('active', on);
      p.tab.setAttribute('aria-selected', on ? 'true' : 'false');
      p.tab.tabIndex = on ? 0 : -1;
      p.panel.classList.toggle('active', on);
    });
  }
  panels.forEach(function(p, i){
    var panel = el('div','panel' + (i === 0 ? ' active' : ''));
    panel.id = 'panel-' + sec.id + '-' + p.group.id;
    panel.setAttribute('role','tabpanel');
    panel.setAttribute('aria-labelledby', p.tab.id);
    panel.appendChild(el('h3','panel-title', p.group.label));
    var list;
    if(p.group.type === 'timeline'){
      list = el('div','xp-list');
      p.group.items.forEach(function(it){
        var a = el('article','xp');
        var when = el('div','xp-when');
        when.appendChild(el('span','xp-date', it.date || ''));
        when.appendChild(el('span','xp-badge', it.badge || ''));
        var body = el('div','xp-body');
        body.appendChild(el('h3','', it.title || ''));
        var ul = el('ul','pts');
        (it.points || []).forEach(function(pt){ ul.appendChild(el('li','', pt)); });
        body.appendChild(ul);
        a.appendChild(when);
        a.appendChild(body);
        list.appendChild(a);
      });
    }else{
      list = el('div','card-grid');
      p.group.items.forEach(function(it){
        var card = el('article','card pr reveal');
        card.appendChild(el('h3','', icon(it.icon) + ' ' + it.title));
        var ul = el('ul','pts');
        (it.points || []).forEach(function(pt){ ul.appendChild(el('li','', pt)); });
        card.appendChild(ul);
        list.appendChild(card);
      });
    }
    panel.appendChild(list);
    p.panel = panel;
    sec.appendChild(panel);
    p.tab.addEventListener('click', function(){ activate(i); });
  });
  sec.appendChild(tabsEl);
  sec.insertBefore(tabsEl, sec.children[1]);
  tabsEl.addEventListener('keydown', function(e){
    if(['ArrowRight','ArrowLeft','Home','End'].indexOf(e.key) < 0){ return; }
    e.preventDefault();
    var cur = 0;
    panels.forEach(function(p, i){ if(p.tab.classList.contains('active')){ cur = i; } });
    if(e.key === 'ArrowRight'){ cur = (cur + 1) % panels.length; }
    else if(e.key === 'ArrowLeft'){ cur = (cur - 1 + panels.length) % panels.length; }
    else if(e.key === 'Home'){ cur = 0; }
    else{ cur = panels.length - 1; }
    activate(cur);
    panels[cur].tab.focus();
  });
}

/* ============ 观察器 ============ */
var revealObserver = new IntersectionObserver(function(entries){
  entries.forEach(function(en){
    if(en.isIntersecting){
      en.target.classList.add('in');
      en.target.querySelectorAll('.bar-fill').forEach(function(f){
        f.style.width = (f.getAttribute('data-level') || 0) + '%';
      });
      revealObserver.unobserve(en.target);
    }
  });
}, { threshold: .12, rootMargin: '0px 0px -36px 0px' });

var spyObserver = new IntersectionObserver(function(entries){
  entries.forEach(function(en){
    if(en.isIntersecting){
      var links = document.querySelectorAll('.nav-link');
      links.forEach(function(a){
        a.classList.toggle('active', a.getAttribute('href') === '#' + en.target.id);
      });
    }
  });
}, { rootMargin: '-42% 0px -52% 0px' });

function attachSpy(){
  document.querySelectorAll('main section').forEach(function(s){ spyObserver.observe(s); });
}

$('#copyBtn').addEventListener('click', function(){
  var D = DATA[LANG], U = UI[LANG];
  var parts = [];
  var e = D.contact.email;
  if(e && e.local && e.domain){ parts.push(U.labels.email + ': ' + e.local + '@' + e.domain); }
  if(D.contact.phone){ parts.push(U.labels.phone + ': ' + D.contact.phone); }
  if(D.contact.phone2){ parts.push(U.labels.phone2 + ': ' + D.contact.phone2); }
  parts.push(U.labels.origin + ': ' + D.meta.origin);
  var text = parts.join('\n');
  function done(){ toast(U.copied); }
  function fallback(){
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try{ document.execCommand('copy'); done(); }
    catch(err){ toast(U.copyFail); }
    ta.remove();
  }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done, fallback);
  }else{
    fallback();
  }
});

/* ============ 返回顶部 & 导航阴影 ============ */
var backTop = $('#backTop');
backTop.innerHTML = icon('up');
window.addEventListener('scroll', function(){
  backTop.classList.toggle('show', window.scrollY > 420);
  $('#nav').classList.toggle('scrolled', window.scrollY > 8);
}, { passive: true });
backTop.addEventListener('click', function(){
  window.scrollTo({ top: 0, behavior: 'smooth' });
});

/* ============ 证书原图灯箱 ============ */
var lbEl = $('#lightbox'), lbImg = $('#lbImg'), lbCap = $('#lbCap'), lbHintEl = $('#lbHint');
function openLB(i, c){
  if(!(window.CERT_IMGS && window.CERT_IMGS[i])){ return; }
  lbImg.src = window.CERT_IMGS[i];
  lbImg.alt = c.name;
  lbCap.textContent = c.name + (c.id ? ' · ' + c.id : '');
  lbHintEl.textContent = UI[LANG].lbHint;
  lbEl.classList.add('show');
  document.body.style.overflow = 'hidden';
  $('#lbClose').focus();
}
function closeLB(){
  lbEl.classList.remove('show');
  document.body.style.overflow = '';
  setTimeout(function(){ if(!lbEl.classList.contains('show')){ lbImg.src = ''; } }, 260);
}
$('#lbClose').addEventListener('click', closeLB);
lbEl.addEventListener('click', function(e){ if(e.target === lbEl){ closeLB(); } });
document.addEventListener('keydown', function(e){
  if(e.key === 'Escape' && lbEl.classList.contains('show')){ closeLB(); }
});

/* ============ 首次渲染（带进场动画） ============ */
renderAll(true);

})();
</script>
</body>
